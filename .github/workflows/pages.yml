name: Deploy Hemi Chess

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Unzip the site
        run: |
          if [ ! -f hemi-chess-site.zip ]; then echo "hemi-chess-site.zip is missing from the repository root"; exit 1; fi
          mkdir _site
          unzip -q hemi-chess-site.zip -d _site
          test -f _site/index.html || { echo "index.html not found inside the zip"; exit 1; }
          ls -la _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
