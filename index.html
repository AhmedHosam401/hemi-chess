<style>
/* Layout concept: a tall, narrow 4x8 board is the hero. On a phone the board takes the height of the screen
   (squares sized from the viewport height) with a tool rail beside it; on desktop the side panel carries moves,
   engine lines and the review summary. Dark-first ink palette with one amber accent. */
:root {
  --bg: #0f1318;
  --panel: #171d25;
  --panel2: #1f2731;
  --line: #2b3542;
  --text: #e8edf3;
  --muted: #8e9aab;
  --accent: #f0b64a;
  --accent-ink: #241802;
  --good: #6dbb5a;
  --bad: #ef5b4f;
  --info: #5aa7f0;
  --scrim: rgba(5, 8, 12, .62);
  --shadow: 0 12px 40px rgba(0, 0, 0, .45);
  --ev-dark: #2a2f36;
  --ev-light: #f3f3ef;
  --sq-l: #e9dfc7;
  --sq-d: #a6815f;
  --hl-last: rgba(240, 190, 60, .46);
  --hl-sel: rgba(110, 200, 120, .55);
  --font: "Cairo", system-ui, "Segoe UI", Tahoma, "DejaVu Sans", sans-serif;
  --gutter: 16px;
  --evw: 22px;
  --railw: 50px;
  --gap: 8px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e8ecf0; --panel: #ffffff; --panel2: #f0f3f6; --line: #d1d8e1; --text: #17202b; --muted: #5d6a7b;
    --accent: #b86d0c; --accent-ink: #ffffff; --good: #3d8b2f; --bad: #c9392e; --info: #1f6fc4;
    --scrim: rgba(20, 28, 40, .45); --shadow: 0 12px 40px rgba(20, 30, 50, .22);
    --ev-dark: #3a414b; --ev-light: #ffffff; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e8ecf0; --panel: #ffffff; --panel2: #f0f3f6; --line: #d1d8e1; --text: #17202b; --muted: #5d6a7b;
  --accent: #b86d0c; --accent-ink: #ffffff; --good: #3d8b2f; --bad: #c9392e; --info: #1f6fc4;
  --scrim: rgba(20, 28, 40, .45); --shadow: 0 12px 40px rgba(20, 30, 50, .22);
  --ev-dark: #3a414b; --ev-light: #ffffff; color-scheme: light;
}
:root[data-board="green"] { --sq-l: #eeeed2; --sq-d: #769656; }
:root[data-board="blue"] { --sq-l: #dee3e6; --sq-d: #8ca2ad; }
:root[data-board="slate"] { --sq-l: #d9d9de; --sq-d: #7b7f93; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.5;
  overscroll-behavior: none; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- piece colours ---------- */
.pcv.w { --pf: url(#gW); --ps: #2a2520; --pd: #3a342c; --pe: #2a2520; --ph: #ffffff; }
.pcv.b { --pf: url(#gB); --ps: #0d0d10; --pd: #b8b8c4; --pe: #f1f1f5; --ph: #c9c9d6; }
.pg { fill: var(--pf); stroke: var(--ps); stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; }
.pd { stroke: var(--pd); stroke-width: 1.2; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .75; }
.pe { fill: var(--pe); stroke: none; }
.ph { stroke: var(--ph); stroke-width: 1.3; fill: none; stroke-linecap: round; opacity: .6; }
svg.pcv { display: block; width: 100%; height: 100%; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: 52px; display: flex; align-items: center; gap: 8px;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.brand { flex: 1; display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: .2px; }
.logo { width: 36px; height: 36px; flex: none; display: block; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .35)); }
.bname { display: grid; line-height: 1.12; }
.bname b { font-size: 17px; font-weight: 800; }
.bname i { font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .09em; color: var(--accent); }
.hen { font-size: 17px; font-weight: 800; letter-spacing: .1em; color: var(--accent); margin-top: 2px; }
.ib { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 12px; color: var(--text); }
.ib:hover { background: var(--panel2); }

.screen { padding: 14px max(var(--gutter), env(safe-area-inset-right, 0px)) 28px max(var(--gutter), env(safe-area-inset-left, 0px)); max-width: 1100px; margin: 0 auto; }

/* ---------- home ---------- */
.hero { display: flex; align-items: center; gap: 20px; padding: 6px 0 18px; }
.hero-board { --sq: 24px; width: calc(var(--sq) * 4); height: calc(var(--sq) * 8); position: relative; flex: none; direction: ltr; border-radius: 6px; overflow: hidden; box-shadow: var(--shadow); }
.hero-board .sq { position: absolute; width: var(--sq); height: var(--sq); left: calc(var(--c) * var(--sq)); top: calc(var(--r) * var(--sq)); }
.sq.l, .hero-board .l { background: var(--sq-l); }
.sq.d, .hero-board .d { background: var(--sq-d); }
.hero h1 { margin: 0; font-size: 32px; line-height: 1.15; font-weight: 800; text-wrap: balance; }
.hero p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.menu { display: grid; gap: 10px; grid-template-columns: 1fr; }
.mcard {
  display: flex; align-items: center; gap: 14px; text-align: start; padding: 14px 16px; border: 1px solid var(--line);
  background: var(--panel); border-radius: 14px; width: 100%;
}
.mcard:hover { background: var(--panel2); }
.mcard .mi { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--panel2); color: var(--accent); flex: none; }
.mcard.pri { border-color: var(--accent); }
.mcard.pri .mi { background: var(--accent); color: var(--accent-ink); }
.mcard b { display: block; font-size: 17px; }
.mcard span.s { display: block; color: var(--muted); font-size: 13.5px; }
.sect { margin: 26px 0 10px; font-size: 14px; color: var(--muted); font-weight: 700; letter-spacing: .3px; }
.hist { display: grid; gap: 8px; }
.hrow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.hrow .ht { flex: 1; min-width: 0; }
.hrow .ht b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hrow .ht span { color: var(--muted); font-size: 12.5px; }
.res { min-width: 54px; text-align: center; padding: 3px 8px; border-radius: 8px; font-weight: 800; font-size: 13px; background: var(--panel2); direction: ltr; }
.res.win { color: var(--good); } .res.loss { color: var(--bad); } .res.draw { color: var(--muted); }
.mini { border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 7px 12px; font-size: 14px; font-weight: 700; }
.mini:hover { border-color: var(--accent); }
.mini.danger:hover { border-color: var(--bad); color: var(--bad); }
.empty { color: var(--muted); font-size: 14px; padding: 14px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; }

/* ---------- game layout ---------- */
.gamewrap {
  --sq: clamp(34px, min(calc((100vw - 2 * var(--gutter) - var(--evw) - var(--railw) - 2 * var(--gap)) / 4), calc((100vh - 222px) / 8)), 96px);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
@supports (height: 100dvh) {
  .gamewrap { --sq: clamp(34px, min(calc((100vw - 2 * var(--gutter) - var(--evw) - var(--railw) - 2 * var(--gap)) / 4), calc((100dvh - 222px) / 8)), 96px); }
}
.boardcol { display: flex; flex-direction: column; align-items: center; gap: 6px; }
#game.screen { padding-top: 8px; }
.rowW { width: calc(var(--sq) * 4 + var(--evw) + var(--railw) + 2 * var(--gap)); }
.pbar { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 2px; }
.pbar .pav { width: 32px; height: 32px; border-radius: 9px; background: var(--panel2); border: 1px solid var(--line); padding: 2px; flex: none; }
.pbar .pmeta { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; line-height: 1.2; }
.pbar .pname { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.pbar .pcap { display: flex; align-items: center; height: 16px; direction: ltr; justify-content: flex-start; }
.pbar .pcap .cp { width: 15px; height: 15px; margin-inline-end: -5px; }
.pbar .pcap .mat { margin-inline-start: 10px; color: var(--muted); font-size: 12px; font-weight: 700; }
.pbar .turn { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); white-space: nowrap; }
.pbar.active .pav { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; display: inline-block; }
.dot.on { background: var(--good); }
.boardrow { display: flex; gap: var(--gap); align-items: stretch; justify-content: center; direction: ltr; }
.evalbar { position: relative; width: var(--evw); border-radius: 8px; overflow: hidden; background: var(--ev-dark); visibility: hidden; flex: none; }
.evalbar.on { visibility: visible; }
.evfill { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: var(--ev-light); transition: height .35s ease; }
.evalbar.flip .evfill { bottom: auto; top: 0; }
.evnum { position: absolute; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; padding: 3px 0; }
.evnum.top { top: 0; } .evnum.bot { bottom: 0; }
.evnum.onlight { color: #20242a; } .evnum.ondark { color: #f1f1ee; }

.board { position: relative; width: calc(var(--sq) * 4); height: calc(var(--sq) * 8); border-radius: 8px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: var(--shadow); direction: ltr; }
.sq, .pc { position: absolute; left: calc(var(--c) * var(--sq)); top: calc(var(--r) * var(--sq)); width: var(--sq); height: var(--sq); }
.sq::before { content: ""; position: absolute; inset: 0; }
.sq.last::before { background: var(--hl-last); }
.sq.sel::before { background: var(--hl-sel); }
.sq.chk::before { background: radial-gradient(circle at 50% 50%, rgba(235, 50, 40, .95) 0%, rgba(235, 50, 40, .65) 38%, rgba(235, 50, 40, 0) 72%); }
.sq.dest::after { content: ""; position: absolute; left: 50%; top: 50%; width: 30%; height: 30%; margin: -15% 0 0 -15%; border-radius: 50%; background: rgba(20, 30, 20, .32); }
.sq.cap::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 calc(var(--sq) * .09) rgba(20, 30, 20, .32); }
.sq i { position: absolute; font-style: normal; font-size: calc(var(--sq) * .16); font-weight: 800; line-height: 1; pointer-events: none; opacity: .85; }
.sq i.rk { left: 4%; top: 5%; } .sq i.fl { right: 6%; bottom: 4%; }
.sq.l i { color: var(--sq-d); } .sq.d i { color: var(--sq-l); }
.pcs { position: absolute; inset: 0; pointer-events: none; }
.pc { transition: left .17s ease, top .17s ease; will-change: left, top; }
.noanim .pc { transition: none; }
.pc.drag { z-index: 9; transition: none; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .45)); }
.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; overflow: visible; }
.mk { display: inline-grid; place-items: center; border-radius: 50%; color: #fff; line-height: 1; flex: none; font-style: normal; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .16); }
.mk b { font-weight: 900; font-size: .56em; letter-spacing: -.04em; font-family: system-ui, sans-serif; direction: ltr; }
.mk svg { width: 64%; height: 64%; fill: #fff; display: block; }
.mk svg.st { fill: none; stroke: #fff; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.badge { position: absolute; z-index: 6; width: calc(var(--sq) * .4); height: calc(var(--sq) * .4); min-width: 20px; min-height: 20px; font-size: max(20px, calc(var(--sq) * .4)); box-shadow: 0 1px 5px rgba(0, 0, 0, .55), inset 0 -2px 0 rgba(0, 0, 0, .16); pointer-events: none; }

.rail { width: var(--railw); display: flex; flex-direction: column; gap: 6px; justify-content: flex-start; direction: rtl; }
.rb { width: var(--railw); min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: var(--text); font-size: 10.5px; font-weight: 700; line-height: 1.1; }
.rb:hover { background: var(--panel2); }
.rb.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.rb:disabled { opacity: .38; cursor: default; }
.rb.danger:hover { border-color: var(--bad); color: var(--bad); }
.navrow { display: flex; gap: 8px; justify-content: center; direction: ltr; }
.nb { width: 56px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; }
.nb:hover { background: var(--panel2); } .nb:disabled { opacity: .35; }

.side { width: 100%; max-width: calc(var(--sq) * 4 + var(--evw) + var(--railw) + 2 * var(--gap) + 160px); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.banners { display: flex; flex-direction: column; gap: 8px; }
.bn { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 14.5px; }
.bn .grow { flex: 1; min-width: 140px; }
.bn b { font-weight: 800; }
.bn .bdg { width: 30px; height: 30px; font-size: 30px; }
.en { color: var(--muted); font-size: .82em; font-weight: 600; }
.bn.warn { border-color: var(--accent); }
.bn.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
.bn .code { font-size: 22px; letter-spacing: 4px; font-weight: 800; direction: ltr; font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 14px; min-height: 38px; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 10px; min-height: 32px; font-size: 13px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.panel h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .3px; }
.movelist { position: relative; direction: ltr; display: flex; flex-wrap: nowrap; gap: 4px; overflow-x: auto; padding: 4px 2px; align-items: center; scrollbar-width: thin; }
.movelist .mn { color: var(--muted); font-size: 12.5px; padding: 0 2px 0 8px; flex: none; font-variant-numeric: tabular-nums; }
.movelist button.mv { flex: none; border: 0; background: transparent; padding: 4px 7px; border-radius: 8px; font-weight: 700; font-size: 14.5px; white-space: nowrap; display: inline-flex; gap: 3px; align-items: center; }
.movelist button.mv:hover { background: var(--panel2); }
.movelist button.mv.cur { background: var(--accent); color: var(--accent-ink); }
.movelist .q { width: 15px; height: 15px; font-size: 15px; margin-inline-start: 3px; vertical-align: -3px; }
.movelist .none { color: var(--muted); font-size: 13.5px; padding: 4px 6px; }
.anabox .aline { display: flex; align-items: baseline; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); direction: ltr; }
.anabox .aline:first-of-type { border-top: 0; }
.asc { min-width: 52px; font-weight: 800; font-size: 14px; padding: 2px 6px; border-radius: 6px; text-align: center; font-variant-numeric: tabular-nums; }
.asc.w { background: var(--ev-light); color: #20242a; } .asc.b { background: var(--ev-dark); color: #f1f1ee; }
.amv { flex: 1; min-width: 0; font-size: 13.5px; color: var(--text); overflow-wrap: anywhere; }
.adp { color: var(--muted); font-size: 12px; margin-top: 6px; direction: rtl; }
.accrow { display: flex; gap: 10px; }
.acc { flex: 1; border-radius: 12px; padding: 8px 10px; background: var(--panel2); text-align: center; }
.acc b { display: block; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.acc span { color: var(--muted); font-size: 12.5px; }
.cnt { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
.cnt td { padding: 3px 4px; border-top: 1px solid var(--line); }
.cnt td.n { text-align: center; width: 54px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cnt .tag { display: inline-flex; align-items: center; gap: 8px; }
.cnt .tag i { width: 22px; height: 22px; font-size: 22px; }
.graph { width: 100%; height: auto; display: block; margin-top: 10px; border-radius: 10px; cursor: pointer; background: var(--ev-dark); }
.progress { height: 8px; border-radius: 99px; background: var(--panel2); overflow: hidden; margin-top: 8px; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.note { color: var(--muted); font-size: 13px; }

/* ---------- dialog ---------- */
dialog { border: 0; padding: 0; background: transparent; color: var(--text); max-width: 100vw; max-height: 100dvh; margin: auto; overflow: visible; }
dialog::backdrop { background: var(--scrim); backdrop-filter: blur(2px); }
.dbox { width: min(440px, calc(100vw - 24px)); max-height: calc(100dvh - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); margin: 0; }
.dbox h2 { margin: 0 0 12px; font-size: 20px; }
.dbody { display: flex; flex-direction: column; gap: 14px; }
.dact { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; position: sticky; bottom: -18px; padding: 12px 0 0; background: var(--panel); }
.dact .btn { flex: 1; min-width: 110px; }
.field label, .lbl { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.field input[type=text], .field input[type=url], .field input[type=password], .field input:not([type]) { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; min-height: 44px; }
.field input.code { direction: ltr; text-align: center; letter-spacing: 6px; font-size: 22px; font-weight: 800; text-transform: uppercase; }
.field input.ltr { direction: ltr; text-align: left; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1; min-width: 70px; padding: 8px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); font-weight: 700; font-size: 14px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.swatches { display: flex; gap: 10px; }
.swatches button { width: 46px; height: 46px; border-radius: 10px; border: 2px solid var(--line); padding: 0; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; direction: ltr; }
.swatches button.on { border-color: var(--accent); }
.swatches i { display: block; }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; }
.sw button.tg { width: 50px; height: 28px; border-radius: 99px; border: 0; background: var(--line); position: relative; flex: none; }
.sw button.tg::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: inset-inline-start .15s; }
.sw button.tg.on { background: var(--good); } .sw button.tg.on::after { inset-inline-start: 25px; }
.promo { display: flex; gap: 10px; justify-content: center; direction: ltr; }
.promo button { width: 72px; height: 72px; padding: 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--sq-l); }
.promo button:hover { border-color: var(--accent); background: var(--sq-d); }
.rules p { margin: 0 0 8px; } .rules ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; }
pre.rl { direction: ltr; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 12.5px; overflow-x: auto; margin: 0; user-select: all; }
details summary { cursor: pointer; font-weight: 700; }
.bigres { text-align: center; padding: 4px 0 0; }
.bigres .t { font-size: 28px; font-weight: 800; line-height: 1.2; }
.bigres .s { color: var(--muted); margin-top: 4px; }
.bigres.win .t { color: var(--good); } .bigres.loss .t { color: var(--bad); }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; max-width: calc(100vw - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 900px) {
  .menu { grid-template-columns: 1fr 1fr; }
  .gamewrap { --sq: clamp(44px, calc((100vh - 238px) / 8), 90px); flex-direction: row; align-items: flex-start; justify-content: center; gap: 28px; }
  .side { width: 380px; max-width: 380px; }
  .movelist { flex-wrap: wrap; overflow: visible; max-height: 240px; overflow-y: auto; }
  .movelist .mn { flex-basis: 34px; padding-left: 0; text-align: right; }
}
@supports (height: 100dvh) {
  @media (min-width: 900px) { .gamewrap { --sq: clamp(44px, calc((100dvh - 238px) / 8), 90px); } }
}
@media (max-height: 560px) and (orientation: landscape) {
  .gamewrap { --sq: clamp(30px, calc((100vh - 120px) / 8), 60px); flex-direction: row; align-items: flex-start; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) { .pc, .evfill, #toast { transition: none; } }

/* ---------- account ---------- */
.mi.av { font-weight: 800; font-size: 20px; background: var(--accent); color: var(--accent-ink); }
.mcard.acct:not(.on) { border-style: dashed; }
.acline { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); }
.pwrow { display: flex; gap: 8px; align-items: center; }
.pwrow input { flex: 1; min-width: 0; width: auto; }
#acName, #acPass, #acPass2 { direction: ltr; text-align: left; }
.acbig { display: flex; align-items: center; gap: 14px; }
.acbig .mi { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.acbig b { display: block; font-size: 20px; }
.note.small { font-size: 12.5px; line-height: 1.6; }

</style>
</head>

var Eng = (function () {
  var workerUrl = null, fallback = false, readyP = null, HCEngine = null;

        w.onerror = function () { done(true); };

  }
